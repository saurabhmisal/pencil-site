:root {
  --background: #fcfbf8;
  --foreground: #2a2b28;
  --primary: #be7039;
  --primary-foreground: #fffaf4;
  --secondary: #f0eee8;
  --accent: #ebe8df;
  --muted: #767770;
  --border: #e5e2da;
  --sidebar: #f4f2ec;
  --green: #628572;
  color-scheme: light;
}
:root.dark {
  --background: #1b1c1a;
  --foreground: #e7e7df;
  --primary: #d5a26a;
  --primary-foreground: #242019;
  --secondary: #252622;
  --accent: #30312b;
  --muted: #92958a;
  --border: #34362f;
  --sidebar: #171815;
  --green: #9bbf9e;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Inter,-apple-system,BlinkMacSystemFont,sans-serif;
  font-size: 14px;
  line-height: 1.65;
  background: var(--background);
  color: var(--foreground);
}
button,a,input,textarea,select {
  -webkit-tap-highlight-color: transparent;
}
button,a {
  cursor: pointer;
}
button {
  font: inherit;
}
a {
  color: inherit;
  text-decoration: none;
}
button:focus-visible,a:focus-visible,summary:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 4px;
}
button:disabled {
  cursor: default;
}
button:not([data-slot]) {
  background: none;
  border: 0;
  color: inherit;
}
h1,h2,h3,p {
  margin: 0;
}
h1 {
  font-size: 31px;
  font-weight: 550;
  letter-spacing: -1.2px;
  line-height: 1.25;
}
h2 {
  font-size: 21px;
  font-weight: 500;
  letter-spacing: -.5px;
}
h3 {
  font-size: 14px;
  font-weight: 550;
}
p {
  white-space: pre-wrap;
}
small {
  font-size: 11px;
  color: var(--muted);
}
input,textarea,select {
  font-family: inherit;
}
select {
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--background);
  padding: 9px 12px;
  color: var(--foreground);
}
textarea {
  line-height: 1.7 !important;
}
.app-shell {
  min-height: 100vh;
}
.sidebar {
  width: 238px;
  position: fixed;
  inset: 0 auto 0 0;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  padding: 26px 15px 12px;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -.8px;
  padding: 0 12px;
}
.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 29px;
  height: 31px;
  color: var(--primary);
  transform: rotate(-8deg);
}
.workspace-selector {
  margin-top: 32px;
  display: flex;
  align-items: center;
  text-align: left;
  gap: 10px;
  padding: 6px 10px;
}
.workspace-selector>span:nth-child(2) {
  font-size: 12px;
  font-weight: 500;
  flex: 1;
}
.workspace-selector small,.profile small {
  display: block;
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
}
.avatar {
  width: 29px;
  height: 29px;
  border: 1px solid var(--border);
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  background: var(--accent);
}
.nav-search {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--muted) !important;
  font-size: 12px !important;
  margin: 24px 5px 18px;
  padding: 6px;
}
.nav-search kbd {
  margin-left: auto;
  font-size: 10px;
  opacity: .7;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  border-radius: 6px;
  padding: 9px 12px;
  text-align: left;
  font-size: 13px !important;
  color: var(--muted) !important;
  margin: 2px 0;
